services:
  web:
    build:
      context: .
      target: prod
    container_name: photoffice-web
    ports:
      - "8080:80"
    # Kein Bind-Mount für den App-Code: Der komplette Code wurde bereits
    # beim "docker compose build" (Stage "prod" im Dockerfile) per COPY ins
    # Image kopiert. Dadurch entfällt die Abhängigkeit von Host-Dateirechten/
    # SELinux (siehe Troubleshooting-Abschnitt in der README zu
    # ".htaccess"-Fehlern).
    #
    # Hinweis: Codeänderungen erfordern danach einen Rebuild, z. B.:
    #   docker compose -f docker-compose.prod.yml up -d --build
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:5.7
    container_name: photoffice-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fotoffice
    volumes:
      - ./photoffice.sql:/docker-entrypoint-initdb.d/01-photoffice.sql
      - ./photoffice_seed.sql:/docker-entrypoint-initdb.d/02-photoffice_seed.sql
      - db_data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: photoffice-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
